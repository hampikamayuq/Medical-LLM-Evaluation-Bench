[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-llm-evaluation-bench"
version = "0.1.0"
description = "Clinician-oriented benchmark for evaluating medical LLM behavior on synthetic dermatology tasks."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
med-eval = "med_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
