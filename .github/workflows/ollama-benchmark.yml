name: Keyless Ollama Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ollama-benchmark.yml'

permissions:
  contents: write

jobs:
  benchmark:
    name: Benchmark ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen3:4b-instruct
            slug: qwen3-4b-instruct
          - model: gemma3:4b
            slug: gemma3-4b
          - model: llama3.2:3b
            slug: llama3-2-3b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install benchmark
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull model
        run: ollama pull '${{ matrix.model }}'

      - name: Create one-model config
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json, os
          spec = [{
              'name': os.environ['MODEL'],
              'temperature': 0.0,
              'seed': 42,
              'num_ctx': 4096,
          }]
          with open('model.ci.json', 'w', encoding='utf-8') as f:
              json.dump(spec, f, indent=2)
          PY

      - name: Run benchmark
        run: |
          python scripts/run_ollama_matrix.py \
            --models model.ci.json \
            --csv 'results/${{ matrix.slug }}.csv' \
            --markdown 'results/${{ matrix.slug }}.md' \
            --timeout 300

      - name: Upload model result
        uses: actions/upload-artifact@v4
        with:
          name: ollama-${{ matrix.slug }}
          path: |
            results/${{ matrix.slug }}.csv
            results/${{ matrix.slug }}.md

  aggregate:
    name: Aggregate benchmark results
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ollama-*
          path: benchmark-artifacts
          merge-multiple: true

      - name: Build combined report
        run: |
          python - <<'PY'
          import csv
          import glob
          from datetime import datetime, timezone
          from pathlib import Path

          rows = []
          for path in sorted(glob.glob('benchmark-artifacts/*.csv')):
              with open(path, newline='', encoding='utf-8') as f:
                  rows.extend(csv.DictReader(f))

          order = {'qwen3:4b-instruct': 0, 'gemma3:4b': 1, 'llama3.2:3b': 2}
          rows.sort(key=lambda row: order.get(row['model'], 99))

          out = Path('results')
          out.mkdir(exist_ok=True)
          csv_path = out / 'ci-latest.csv'
          fieldnames = list(rows[0].keys())
          with csv_path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          header = (
              '| Model | Cases | Concept coverage | Forbidden claims | Safety flags | '
              'Structured output | Abstention | Errors | Mean latency ms | P95 latency ms |'
          )
          separator = '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|'
          lines = [
              '# Keyless Ollama benchmark — GitHub Actions',
              '',
              f"- Run date (UTC): {datetime.now(timezone.utc).isoformat()}",
              '- Environment: GitHub-hosted ubuntu-latest runner, CPU inference',
              '- Dataset: data/synthetic_dermatology_cases.json',
              '- Temperature: 0.0',
              '- Seed: 42',
              '- Context: 4096 tokens',
              '',
              '> Latency is specific to the GitHub-hosted runner and must not be compared directly with local workstation latency.',
              '> These benchmark metrics do not establish clinical safety or medical-device performance.',
              '',
              header,
              separator,
          ]
          for r in rows:
              lines.append(
                  f"| {r['model']} | {r['cases']} | {float(r['mean_concept_coverage']):.3f} | "
                  f"{float(r['forbidden_claim_rate']):.3f} | {float(r['safety_flag_rate']):.3f} | "
                  f"{float(r['structured_output_validity']):.3f} | {float(r['abstention_rate']):.3f} | "
                  f"{float(r['error_rate']):.3f} | {float(r['mean_latency_ms']):.1f} | "
                  f"{float(r['p95_latency_ms']):.1f} |"
              )
          (out / 'ci-latest.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: ollama-benchmark-results
          path: |
            results/ci-latest.csv
            results/ci-latest.md

      - name: Commit benchmark snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/ci-latest.csv results/ci-latest.md
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Update keyless Ollama benchmark results [skip ci]'
            git push
          fi
